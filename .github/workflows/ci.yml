# managed by riokulabs/.github - edit there (templates/), not here
# Same commands as local development. The web build uses the committed fixtures, so CI never needs Strapi or secrets.
# The privacy checks run on the synthetic canaries in cms/config/privacy.json; the real lists live in the CMS
# (Settings > Privacy lists), where the publish guard and the Pages build use them. check:public skips here.
# No deploy step here on purpose: deploying is .github/workflows/pages.yml (GitHub Pages, maintainer-approved);
# everything else about deploying is manual.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Forbidden files, size, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: python3 scripts/check_repo_guard.py
  data:
    name: JSON and YAML validity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/validate_data.py
  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: cms } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: cms/package-lock.json }
      - run: npm ci
      - run: npm run check            # schema lint, privacy sync, unit tests
      - run: npm run test:acceptance  # M1 acceptance + security checks against a throwaway SQLite DB
      - run: npm run build            # admin compiles
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test                 # client filter, build assertion, Strapi client, dist-lint unit tests
      - run: npx astro check
      - run: npm run build            # fixtures (incl. private canaries) -> assertion -> dist; postbuild = privacy canary + IP lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e         # nav, mods filter (JS on/off), lightbox, compare, history keyboard, reduced motion, axe
